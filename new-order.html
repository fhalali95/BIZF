<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Order | BizF</title>


    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f7f9;
            color: #222;
        }
input,
select,
textarea {
    direction: ltr;
    text-align: left;
}
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #333;
            text-decoration: none;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #777;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .card h2 {
            margin-top: 0;
            font-size: 18px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #d8d8d8;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            border-bottom: none;
        }

        .save-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #111;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <a class="back" href="index.html">← Back to Dashboard</a>

    <h1>New Order</h1>
    <p class="subtitle">Create and calculate a new customer order.</p>

    <div class="card">
        <h2>Customer Details</h2>

        <div class="form-grid">
            <div>
                <label>Customer Name</label>
                <input type="text" placeholder="Enter customer name">
            </div>

            <div>
                <label>Phone Number</label>
                <input type="tel" placeholder="Enter phone number">
            </div>

            <div>
                <label>Order Date</label>
                <input type="text" placeholder="DD/MM/YYYY" inputmode="numeric">
            </div>

            <div>
                <label>Order Status</label>
                <select>
                    <option>Pending</option>
                    <option>Confirmed</option>
                    <option>Completed</option>
                    <option>Cancelled</option>
                </select>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>Order Item</h2>

        <div class="form-grid">
            <div>
                <label>Product</label>
                <input type="text" placeholder="Product name">
            </div>

            <div>
                <label>Quantity</label>
                <input type="number" min="1" value="1">
            </div>

            <div>
                <label>Unit Price (AED)</label>
                <input type="number" min="0" step="0.01" placeholder="0.00">
            </div>

            <div>
                <label>Unit Cost (AED)</label>
                <input type="number" min="0" step="0.01" placeholder="0.00">
            </div>
        </div>
    </div>

    <div class="card">
        <h2>Discount</h2>

        <div class="form-grid">
            <div>
                <label>Discount Type</label>
                <select>
                    <option>No Discount</option>
                    <option>Percentage (%)</option>
                    <option>Fixed Amount (AED)</option>
                </select>
            </div>

            <div>
                <label>Discount Value</label>
                <input type="number" min="0" step="0.01" value="0">
            </div>
        </div>
    </div>

    <div class="card">
        <h2>Order Summary</h2>

        <div class="summary-row">
            <span>Subtotal</span>
            <strong>AED 0.00</strong>
        </div>

        <div class="summary-row">
            <span>Discount</span>
            <strong>AED 0.00</strong>
        </div>

        <div class="summary-row">
            <span>Cost</span>
            <strong>AED 0.00</strong>
        </div>

        <div class="summary-row">
            <span>Profit</span>
            <strong>AED 0.00</strong>
        </div>

        <div class="summary-row total">
            <span>Total</span>
            <span>AED 0.00</span>
        </div>
    </div>

    <div class="card">
        <label>Notes</label>
        <textarea placeholder="Add order notes..."></textarea>
    </div>

    <button class="save-btn">Save Order</button>

</div>
<script>
document.addEventListener("DOMContentLoaded", function () {

    const numberInputs = document.querySelectorAll('input[type="number"]');
    const selects = document.querySelectorAll("select");
    const summaryValues = document.querySelectorAll(".summary-row strong");
    const totalValue = document.querySelector(".summary-row.total span:last-child");

    const quantity = numberInputs[0];
    const unitPrice = numberInputs[1];
    const unitCost = numberInputs[2];
    const discountValue = numberInputs[3];
    const discountType = selects[1];

    function calculateOrder() {

        const qty = parseFloat(quantity.value) || 0;
        const price = parseFloat(unitPrice.value) || 0;
        const cost = parseFloat(unitCost.value) || 0;
        const discount = parseFloat(discountValue.value) || 0;

        const subtotal = qty * price;
        const totalCost = qty * cost;

        let discountAmount = 0;

        if (discountType.value === "Percentage (%)") {
            discountAmount = subtotal * (discount / 100);
        }

        if (discountType.value === "Fixed Amount (AED)") {
            discountAmount = discount;
        }

        if (discountAmount > subtotal) {
            discountAmount = subtotal;
        }

        const total = subtotal - discountAmount;
        const profit = total - totalCost;

        summaryValues[0].textContent = "AED " + subtotal.toFixed(2);
        summaryValues[1].textContent = "AED " + discountAmount.toFixed(2);
        summaryValues[2].textContent = "AED " + totalCost.toFixed(2);
        summaryValues[3].textContent = "AED " + profit.toFixed(2);

        totalValue.textContent = "AED " + total.toFixed(2);
    }

function convertToEnglishNumbers(value) {
    return value
        .replace(/[٠-٩]/g, function (d) {
            return "0123456789"["٠١٢٣٤٥٦٧٨٩".indexOf(d)];
        })
        .replace(/[۰-۹]/g, function (d) {
            return "0123456789"["۰۱۲۳۴۵۶۷۸۹".indexOf(d)];
        });
}
[quantity, unitPrice, unitCost, discountValue].forEach(function (input) {
    input.addEventListener("input", function () {
        const englishValue = convertToEnglishNumbers(this.value);

        if (this.value !== englishValue) {
            this.value = englishValue;
        }
    });
});
    
    quantity.addEventListener("input", calculateOrder);
    unitPrice.addEventListener("input", calculateOrder);
    unitCost.addEventListener("input", calculateOrder);
    discountValue.addEventListener("input", calculateOrder);
    discountType.addEventListener("change", calculateOrder);

    calculateOrder();
});
</script>
    
</body>
</html>
